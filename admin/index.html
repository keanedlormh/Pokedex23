<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Enciclopedia Técnica v2.9.6</title>
    
    <link rel="stylesheet" href="/admin/admin.css">

    <!-- ============================================== -->
    <!-- [ACTUALIZADO] Bootloader v2.9.6 (Versión Admin)-->
    <!-- ============================================== -->
    <script>
        // 1. Definir la BD global
        window.APP_DB = {
            products: [],
            schemas: {},
            registerProduct: function(product) { this.products.push(product); },
            registerSchema: function(key, schemaGroups) { this.schemas[key] = schemaGroups; }
        };

        // 2. Definir la ruta base (estamos en /admin/, la BD está en /)
        const basePath = '/';

        // 3. Cargar el manifest (SÍNCRONO)
        const xhr = new XMLHttpRequest();
        xhr.open('GET', basePath + 'db/manifest.json', false);
        xhr.send(null);

        if (xhr.status === 200) {
            const manifest = JSON.parse(xhr.responseText);
            
            // 4. Escribir las etiquetas <script> de los esquemas
            manifest.schemas.forEach(path => {
                document.write('<script src="' + basePath + path + '" defer><\/script>');
            });
            
            // 5. [NUEVO] Cargar y registrar las gamas JSON a granel (SÍNCRONO)
            manifest.bulk_gamas.forEach(jsonPath => {
                const jsonXhr = new XMLHttpRequest();
                jsonXhr.open('GET', basePath + jsonPath, false); // Carga síncrona
                jsonXhr.send(null);

                if (jsonXhr.status === 200) {
                    const products = JSON.parse(jsonXhr.responseText);
                    products.forEach(product => {
                        window.APP_DB.registerProduct(product);
                    });
                } else {
                    console.error("ERROR: No se pudo cargar el archivo JSON de gama: " + jsonPath);
                }
            });

            // 6. Escribir las etiquetas <script> de los productos individuales
            Object.values(manifest.products).forEach(productList => {
                productList.forEach(path => {
                    document.write('<script src="' + basePath + path + '" defer><\/script>');
                });
            });

        } else {
            console.error("ERROR CRÍTICO: No se pudo cargar '/db/manifest.json'.");
            alert("ERROR CRÍTICO: No se pudo cargar la base de datos. Revise la consola.");
        }
    </script>
    <!-- ============================================== -->
    <!-- FIN DEL BOOTLOADER                           -->
    <!-- ============================================== -->
    
    <script src="/admin/admin.js" defer></script>
</head>

<body>

    <!-- Encabezado Fijo -->
    <header class="admin-header">
        <div class="header-content">
            <div class="header-left">
                <h1 class="app-title">Administrador <span class="app-version">v2.9.6</span></h1>
            </div>
            <a href="/" class="header-link">Volver a la Enciclopedia</a>
        </div>
    </header>
    
    <!-- Barra de Menús Fija -->
    <nav class="admin-navbar">
        
        <div class="menu-group">
            <button class="menu-title" data-dropdown="menu-edit">Editar</button>
            <div id="menu-edit" class="menu-dropdown">
                <button class="menu-item" data-tab="edit-model">
                    Editar Modelo
                </button>
            </div>
        </div>

        <div class="menu-group">
            <button class="menu-title" data-dropdown="menu-export">Exportar</button>
            <div id="menu-export" class="menu-dropdown">
                <button class="menu-item" data-tab="export-gama">
                    Exportar Gama
                </button>
            </div>
        </div>
        
    </nav>

    <!-- Área de Contenido Principal -->
    <main class="admin-content-area">

        <!-- Panel 1: Editar Modelo (Activo por defecto) -->
        <div id="panel-edit-model" class="content-panel active">
            <div class="panel-layout-2col">
                <aside class="sidebar-column">
                    <div class="futuristic-card search-panel">
                        <h2 class="futuristic-title">1. Cargar Modelo</h2>
                        <input type="text" id="search-model" placeholder="Escribe un modelo (ej: S95TR)" class="futuristic-input w-full">
                        <div id="model-results-list" class="futuristic-list full-list-visible">
                            <!-- Relleno por JS -->
                        </div>
                    </div>
                </aside>
                <main class="main-column">
                    <div class="futuristic-card sticky-panel">
                        <h2 id="product-title" class="spec-title">2. Editor de Producto</h2>
                        <div class="editor-controls">
                            <div class="control-group">
                                <label for="new-model-id" class="futuristic-label">Nuevo Model ID (para exportar):</label>
                                <input type="text" id="new-model-id" class="futuristic-input w-full" placeholder="Ej: NUEVOMODELO">
                            </div>
                            <button id="export-btn" class="futuristic-button">Exportar a .txt</button>
                        </div>
                        <form id="editor-form" class="editor-form-fields">
                            <p id="editor-placeholder" class="text-gray-400">Selecciona un modelo de la izquierda (Paso 1) para cargarlo aquí.</p>
                            <!-- Relleno por JS -->
                        </form>
                    </div>
                </main>
            </div>
        </div>

        <!-- Panel 2: Exportar Gama (Oculto por defecto) -->
        <div id="panel-export-gama" class="content-panel">
            <div class="futuristic-card" style="max-width: 800px; margin: 0 auto;">
                <h2 class="futuristic-title">Exportar Gama Completa</h2>
                
                <div class="gama-export-controls">
                    <div class="control-group">
                        <label for="gama-export-select" class="futuristic-label">Selecciona una gama:</label>
                        <select id="gama-export-select" class="futuristic-select">
                            <option value="">-- Seleccionar --</option>
                            <!-- Relleno por JS -->
                        </select>
                    </div>
                    <button id="export-gama-json-btn" class="futuristic-button">
                        Exportar Gama a JSON
                    </button>
                </div>

                <div id="gama-export-list" class="gama-export-list">
                    <!-- Relleno por JS con los modelos -->
                </div>
            </div>
        </div>

    </main>

</body>
</html>
