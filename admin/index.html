<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Enciclopedia Técnica v2.6</title>
    
    <link rel="stylesheet" href="admin.css">

    <!-- [IMPORTANTE] Carga la misma base de datos que la app principal -->
    <script src="../db/schemas/moduloSoundbars.js" defer></script>
    <script src="../db/schemas/moduloTVs.js" defer></script>
    
    <!-- Carga TODOS los modelos -->
    <!-- Soundbars -->
    <script src="../db/soundbars/s20a.js" defer></script>
    <script src="../db/soundbars/s40t.js" defer></script>
    <script src="../db/soundbars/s40tr.js" defer></script>
    <script src="../db/soundbars/s60t.js" defer></script>
    <script src="../db/soundbars/s60tr.js" defer></script>
    <script src="../db/soundbars/s65q.js" defer></script>
    <script src="../db/soundbars/s70tr.js" defer></script>
    <script src="../db/soundbars/s70ty.js" defer></script>
    <script src="../db/soundbars/s80tr.js" defer></script>
    <script src="../db/soundbars/s90tr.js" defer></script>
    <script src="../db/soundbars/s90ty.js" defer></script>
    <script src="../db/soundbars/s95trsp.js" defer></script>
    <script src="../db/soundbars/sc9s.js" defer></script>
    <script src="../db/soundbars/sg10ty.js" defer></script>
    <script src="../db/soundbars/sqc2.js" defer></script>
    <script src="../db/soundbars/sqc4r.js" defer></script>
    
    <!-- TVs -->
    <script src="../db/tvs/OLED83G55LW.js" defer></script>
    <script src="../db/tvs/75QNED93A6A.js" defer></script>
    <script src="../db/tvs/55UA75006LA.js" defer></script>
    <script src="../db/tvs/50NANO81A6A.js" defer></script>
    <script src="../db/tvs/OLED42C45LA.js" defer></script>
    <script src="../db/tvs/OLED65C54LA.AEU.js" defer></script>
    
    <!-- Carga la lógica del Admin -->
    <script src="admin.js" defer></script>
</head>

<body>

    <div class="container">
        <!-- BARRA SUPERIOR -->
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">Administrador de Datos <span class="app-version">v2.6</span></h1>
            </div>
            <a href="../index.html" class="header-link">Volver a la Enciclopedia</a>
        </header>

        <!-- LAYOUT PRINCIPAL -->
        <div class="main-layout">

            <!-- Columna Izquierda: Búsqueda -->
            <aside class="sidebar-column">
                <div class="futuristic-card search-panel">
                    <h2 class="futuristic-title">1. Cargar Modelo Existente</h2>
                    <input type="text" id="search-model" placeholder="Escribe un modelo (ej: S95TR)" class="futuristic-input w-full">
                    
                    <div id="model-results-list" class="futuristic-list full-list-visible">
                        <!-- Relleno por JS -->
                    </div>
                </div>
            </aside>

            <!-- Columna Derecha: Editor -->
            <main class="main-column">
                <div class="futuristic-card sticky-panel">
                    <h2 id="product-title" class="spec-title">Editor de Producto</h2>
                    
                    <!-- Panel de Controles del Editor -->
                    <div class="editor-controls">
                        <div class="control-group">
                            <label for="new-model-id" class="futuristic-label">Nuevo Model ID (para exportar):</label>
                            <input type="text" id="new-model-id" class="futuristic-input w-full" placeholder="Ej: NUEVOMODELO">
                        </div>
                        <button id="export-btn" class="futuristic-button">Exportar a .txt</button>
                    </div>

                    <!-- Formulario de Atributos -->
                    <form id="editor-form" class="editor-form-fields">
                        <p id="editor-placeholder" class="text-gray-400">Selecciona un modelo de la izquierda para cargarlo en el editor.</p>
                        <!-- Relleno por JS con labels y textareas -->
                    </form>
                </div>
            </main>

        </div> <!-- Fin del layout principal -->
        
    </div> <!-- Fin del contenedor principal -->

</body>
</html>
